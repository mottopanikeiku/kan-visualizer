name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check viewer JavaScript
        run: |
          for script in web/js/*.js; do
            node --check "$script"
          done
      - name: Check bundled model data
        run: |
          for data in web/data/*.json; do
            python -m json.tool "$data" > /dev/null
          done
          test -s web/data/datasets.json
          test -s web/data/model_1d.json
          test -s web/data/model_2d.json
          test -s web/data/model_complex.json
      - name: Upload viewer and exported models
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
