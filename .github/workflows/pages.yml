name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.5'
      - name: Install pinned CPU dependencies
        run: |
          uv venv --python 3.13
          uv pip sync --index-strategy unsafe-best-match --python .venv/bin/python requirements.lock
      - name: Check Python behavior and comparison data
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: .venv/bin/python test_kan.py
      - name: Install headless Chromium
        run: uv run --no-project --with playwright==1.63.0 playwright install --with-deps chromium
      - name: Check guided desktop and mobile viewer
        run: uv run --no-project --with playwright==1.63.0 python tests/pages_smoke.py
      - name: Check viewer JavaScript
        run: |
          for script in web/js/*.js; do
            node --check "$script"
          done
      - name: Check bundled model data
        run: |
          for data in web/data/*.json; do
            python -m json.tool "$data" > /dev/null
          done
          test -s web/data/datasets.json
          test -s web/data/model_1d.json
          test -s web/data/model_2d.json
          test -s web/data/model_complex.json
      - name: Upload viewer and exported models
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
