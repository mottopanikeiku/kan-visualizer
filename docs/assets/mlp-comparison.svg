<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Parameter-matched MLP comparison</title>
<desc id="desc">Final evaluation-grid MSE, five paired seeds. Dots are medians; lines span minimum to maximum. Lower is better. Values are in results/mlp_comparison/summary.json.</desc>
<rect width="800" height="560" fill="white"/>
<g font-family="sans-serif" font-size="15" fill="#17202b">
<text x="24" y="30" font-size="22">Dense MLPs versus Gaussian-edge networks</text>
<text x="24" y="57">Five paired seeds · median and min–max · lower MSE is better</text>
<path d="M315.00 90V478" stroke="#e0e5eb"/>
<text x="315.00" y="504" text-anchor="middle">10^-5</text>
<path d="M413.75 90V478" stroke="#e0e5eb"/>
<text x="413.75" y="504" text-anchor="middle">10^-4</text>
<path d="M512.50 90V478" stroke="#e0e5eb"/>
<text x="512.50" y="504" text-anchor="middle">10^-3</text>
<path d="M611.25 90V478" stroke="#e0e5eb"/>
<text x="611.25" y="504" text-anchor="middle">10^-2</text>
<path d="M710.00 90V478" stroke="#e0e5eb"/>
<text x="710.00" y="504" text-anchor="middle">10^-1</text>
<text x="24" y="99" font-weight="bold">Sine wave</text>
<text x="24" y="119">Gaussian edge (160 params)</text>
